<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Harian Bapas Kelas II Ciangir</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC000;--b:#0A3FA0;--bg:#e9edf3;--pn:#fff;--ink:#1b1f26;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--pn:#1f242c;--ink:#e8eaee}}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--pn);border-bottom:1px solid #8883}
button,select,.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #8886;background:var(--pn);color:var(--ink);cursor:pointer}
button.p{background:var(--b);border-color:var(--b);color:#fff}
:focus-visible{outline:3px solid #ffb300;outline-offset:1px}
#st{font-size:12px;opacity:.7;margin-left:auto}
.main{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:16px}
#stage{width:min(100%,540px)}
#ed{display:none;width:min(100%,470px);background:var(--pn);border:1px solid #8883;border-radius:12px;padding:14px}
#ed.on{display:block}
#ed h2{font-size:17px;margin:0 0 8px}#ed h3{font-size:14px;margin:18px 0 6px}
#ed label{display:block;font-size:12px}
#ed input{width:100%;font:inherit;font-size:13px;padding:6px 8px;margin-top:2px;border:1px solid #8886;border-radius:6px;background:var(--bg);color:var(--ink)}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr);margin-top:8px}
.rw{display:grid;gap:5px;margin-bottom:5px;align-items:center}
.rw.hd span{font-size:11px;opacity:.65}.rw input{margin:0!important}
.x{padding:2px 0!important;font-size:16px!important;line-height:1}
/* ===== Poster ===== */
#poster{width:540px;background:var(--y);position:relative;overflow:hidden;color:#fff;font-family:Poppins,Arial,sans-serif}
#poster table{width:100%;border-collapse:collapse}
#poster td,#poster th{border:1px solid rgba(255,255,255,.4);padding:5px 4px;font-size:12px;text-align:center;font-weight:400}
.wave{position:absolute;left:0;top:0;width:540px;height:150px}
.lg{position:absolute;top:14px;height:58px}.l1{right:76px}.l2{right:16px}
.hd1{position:relative;padding:64px 16px 0}
.t1{font-size:26px;color:#111;line-height:1.05}.t2{font-size:28px;font-weight:700;color:#111;line-height:1.1}
.dt{display:inline-block;margin:10px 0 16px;background:#fff;border:2px solid #111;border-radius:9px;padding:3px 14px;color:#B0504A;font-weight:700;font-size:21px}
.cols{display:grid;grid-template-columns:1fr 205px;gap:14px;padding:0 16px}
.lb{display:block;width:max-content;margin:14px auto 6px;color:#fff;font-weight:700;font-size:13px;padding:4px 16px;background:var(--b);box-shadow:0 2px 3px #0005}
.lb.r{background:linear-gradient(#C42323,#8F1414)}.cols>div>.lb:first-child{margin-top:0}
.bk{background:#000;color:#fff!important;font-weight:700!important}.tl{background:#1B3C40;color:#fff}
#poster .lf{text-align:left;font-weight:700;color:#fff;padding-left:6px}
#poster .jm td{font-weight:700}
#poster .tt td{background:#000;color:#FFF700;font-weight:700;font-size:19px}
#poster .tt td:first-child{color:#fff;font-size:17px}#poster .tt td.g{color:#FFF700;font-size:22px}
.it{display:flex;gap:6px;height:27px;margin-bottom:4px}
.v{width:58px;text-align:center;font-size:17px;line-height:27px;color:rgba(0,0,0,.65);border-radius:4px}
.n{flex:1;border:1.5px solid #A51414;border-radius:5px;color:#000;font-weight:700;font-size:11.5px;padding:0 8px;display:flex;align-items:center;line-height:1.05}
.bud{margin-top:12px}.bud th{background:#000;color:#fff;text-align:left!important;font-weight:700!important;padding-left:8px!important}
.bud td{background:#000;color:#fff;font-weight:700}.bud .s td,.bud .s th{background:#C8C8C8;color:#000}
.lw{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-top:12px}
.pe{border:3px solid #111;border-radius:18px;padding:8px}
.pt{background:#F6C6C6;color:#C0272D;font-weight:700;font-size:10px;text-align:center;border-radius:5px;padding:3px;margin-bottom:8px;box-shadow:0 1px 3px #0005}
.ic{display:flex;justify-content:space-between}.ic div{display:flex;flex-direction:column;align-items:center;gap:6px}
.ic img{width:36px;height:36px;object-fit:contain;background:#000;border-radius:7px;padding:3px}
.ic b{width:36px;text-align:center;background:#D9D9D9;border:2px solid #111;border-radius:7px;font-size:15px;font-weight:400;color:#4b5d66;padding:4px 0}
.pk{text-align:center}.pk .a{display:block;width:max-content;margin:0 auto -2px;position:relative;border:2px solid #111;background:#fff;color:#000;font-weight:700;font-size:10px;padding:2px 8px}
.pk img{width:100%;height:80px;object-fit:cover;display:block;border:2px solid #fff}
.pk .c{background:#fff;border:2px solid #111;color:#000;font-weight:700;font-size:12px;padding:3px 4px;margin-top:-2px}
.pg h3{margin:14px 0 0;color:#fff;font-size:15px;text-align:center;text-shadow:0 1px 2px #0007}
.pg svg{width:100%;display:block}
.lg2{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:center;font-size:9.5px;color:#222}
.lg2 i{display:inline-block;width:8px;height:8px;margin-right:3px}.tp{text-align:center;font-size:10px;color:#222;margin-top:3px}
.soc{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;font-size:10.5px;font-weight:600;color:#7a1010}
.dot{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:middle;margin-right:4px}
.bb{height:16px;background:var(--b);border-top:3px solid #F2B400}
body:not(.adm) .ao{display:none!important}
#bAdm.on{background:#1a7f37;border-color:#1a7f37;color:#fff}
#ed input[type=checkbox]{width:auto;margin:0}
.ck{display:inline-flex!important;align-items:center;gap:5px;margin:0 12px 6px 0;font-size:13px!important}
dialog{border:1px solid #8886;border-radius:12px;background:var(--pn);color:var(--ink);width:min(92vw,320px)}
@media print{.bar,#ed{display:none!important}body{background:#fff}.main{padding:0}#poster{zoom:1!important}@page{margin:0}}
</style>
</head>

  <button class="p ao" id="bEd">Edit data</button>

  <label class="btn ao" for="file">Impor Excel</label><input id="file" type="file" accept=".xlsx,.xls" hidden>
  <button id="bExp">Ekspor Excel</button>
  <button id="bPng">Unduh gambar</button>
  <button id="bPrint">Cetak</button>
  <button id="bAdm" title="Hanya admin yang dapat mengedit">Masuk Admin</button>

const K='lh:',$=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>+v||0,fmt=v=>String(N(v)),rp=v=>'Rp. '+N(v).toLocaleString('id-ID')+',-',sum=(a,i)=>a.reduce((s,r)=>s+N(r[i]),0);

let S=JSON.parse(JSON.stringify(DEF));
const st=m=>{$('#st').textContent=m};
let ADM=false,PEG=[];try{PEG=JSON.parse(localStorage.getItem('lh_peg')||'[]')}catch(e){}
const pkSplit=s=>String(s||'').split(/\s*(?:&|,|;|\s+dan\s+)\s*/i).map(x=>x.trim()).filter(Boolean);
const pegSave=()=>{try{localStorage.setItem('lh_peg',JSON.stringify(PEG))}catch(e){}};
function seedPeg(){if(!PEG.length){PEG=pkSplit(S.piket);pegSave()}}
/* ===== Penyimpanan (localStorage per tanggal) ===== */
function save(){if(!ADM)return;try{localStorage.setItem(K+S.tgl,JSON.stringify(S));localStorage.setItem('lh_last',S.tgl);st('Tersimpan otomatis '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}))}catch(e){st('Penyimpanan browser tidak tersedia - gunakan Ekspor Excel')}hist();if(API)push()}
function load(t){try{const j=localStorage.getItem(K+t);if(j){S=JSON.parse(j);return true}}catch(e){}return false}
function keys(){try{return Object.keys(localStorage).filter(k=>k.startsWith(K)).map(k=>k.slice(K.length)).sort().reverse()}catch(e){return[]}}
const lbl=t=>{const d=new Date(t+'T00:00:00');return isNaN(d)?t:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
let remote=[];
function hist(){const k=[...new Set([...keys(),...remote,S.tgl])].sort().reverse();$('#hist').innerHTML=k.map(t=>`<option value="${t}" ${t===S.tgl?'selected':''}>${lbl(t)}</option>`).join('')}
/* ===== Sinkron Google Sheets ===== */
try{localStorage.removeItem('lh_pin')}catch(e){}
const pinGet=()=>{try{return sessionStorage.getItem('lh_pin')}catch(e){return null}},pinSet=v=>{try{v?sessionStorage.setItem('lh_pin',v):sessionStorage.removeItem('lh_pin')}catch(e){}};
const jam=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
async function pull(t){if(!API)return false;
 try{st('Memuat dari Google Sheets...');const r=await fetch(API+(t?'?tgl='+encodeURIComponent(t):'')),j=await r.json();
  if(!j.ok){st('Server: '+j.error);return false}
  remote=j.daftar||[];if(j.pegawai&&j.pegawai.length){PEG=j.pegawai;pegSave()}if(!j.data){st('Tanggal itu belum ada di Google Sheets');return false}
  S=Object.assign(JSON.parse(JSON.stringify(DEF)),j.data);return true}
 catch(e){st('Tidak bisa terhubung ke Google Sheets - memakai data perangkat ini');return false}}
let pt;
function push(){clearTimeout(pt);pt=setTimeout(async()=>{
 const pin=pinGet();if(!pin){logout('Sesi admin berakhir - masuk lagi untuk menyimpan');return}
 st('Menyimpan ke Google Sheets...');
 try{const r=await fetch(API,{method:'POST',body:JSON.stringify({pin,data:S,pegawai:PEG})}),j=await r.json();
  if(j.ok){pinSet(pin);remote=j.daftar||remote;hist();st(j.aktif?'Tersimpan di Google Sheets '+jam():'Tersimpan di Riwayat (tanggal lama) '+jam())}
  else{st('Gagal menyimpan: '+j.error);if(/PIN/.test(j.error))logout()}}
 catch(e){st('Gagal terhubung ke Google Sheets - data tersimpan di perangkat ini')}},1500)}
/* ===== Tampilan poster ===== */
function tK(){const a=S.klien,j=[1,2,3,4].map(i=>sum(a,i)),d=j[0]+j[1],k=j[2]+j[3];
 return `<table><thead><tr><th rowspan="2" class="bk" style="width:36%">JENIS<br>BIMBINGAN</th><th colspan="2" class="bk">DEWASA</th><th colspan="2" class="bk">ANAK</th></tr><tr><th class="tl">L</th><th class="tl">P</th><th class="tl">L</th><th class="tl">P</th></tr></thead><tbody>`+
 a.map((r,i)=>`<tr style="background:${RED[Math.min(i,5)]}"><td class="lf">${E(r[0])}</td>${[1,2,3,4].map(c=>`<td>${r[c]?fmt(r[c]):'-'}</td>`).join('')}</tr>`).join('')+
 `<tr class="jm" style="background:${RED[5]}"><td class="lf">Jumlah</td>${j.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr><tr class="tt"><td rowspan="2">TOTAL</td><td colspan="2">${fmt(d)}</td><td colspan="2">${fmt(k)}</td></tr><tr class="tt"><td colspan="4" class="g">${fmt(d+k)}</td></tr></tbody></table>`}
const tP=()=>`<table><thead><tr><th class="bk">JENIS PERKARA</th><th class="bk">KLIEN<br>DEWASA</th><th class="bk">KLIEN<br>ANAK</th></tr></thead><tbody>${S.pidana.map((r,i)=>`<tr style="background:${i%2?'#8A1010':'#9B1212'}"><td class="lf">${E(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td></tr>`).join('')}</tbody></table>`;
const lit=(a,c)=>a.map((r,i)=>`<div class="it"><div class="v" style="background:${VC[i%8]}">${fmt(r[1])}</div><div class="n" style="background:${c}">${E(r[0])}</div></div>`).join('');
function pie(a){const t=sum(a,1),C=['#A51414','#E8650F','#E3B52A','#6DB08F','#3C7C90','#9C5B9C','#5B8DEF','#8B6B4A'],cx=100,cy=75,R=66;let g=-Math.PI/2,s='';
 a.forEach((r,i)=>{const v=N(r[1]);if(!v||!t)return;const f=v/t,h=g+f*2*Math.PI;
  s+=f>=.9999?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${C[i%8]}"/>`:`<path d="M${cx} ${cy}L${cx+R*Math.cos(g)} ${cy+R*Math.sin(g)}A${R} ${R} 0 ${f>.5?1:0} 1 ${cx+R*Math.cos(h)} ${cy+R*Math.sin(h)}Z" fill="${C[i%8]}" stroke="#FFC000" stroke-width="1.5"/>`;
  if(f>.04){const m=(g+h)/2;s+=`<text x="${cx+R*.62*Math.cos(m)}" y="${cy+R*.62*Math.sin(m)+5}" text-anchor="middle" fill="#fff" stroke="#000" stroke-opacity=".35" stroke-width="2.5" paint-order="stroke" font-size="14" font-weight="700">${v}</text>`}g=h});
 return `<svg viewBox="0 0 200 150" role="img" aria-label="Diagram jumlah pegawai">${s}</svg><div class="lg2">${a.map((r,i)=>`<span><i style="background:${C[i%8]}"></i>${E(r[0])}</span>`).join('')}</div><div class="tp">Total ${t} pegawai</div>`}

 $('#klien').innerHTML=tK();$('#pid').innerHTML=tP();
 const pc=N(S.alok)?Math.round(N(S.serap)/N(S.alok)*100):0;
 $('#bud').innerHTML=`<tr><th>Alokasi Anggaran</th><td>${rp(S.alok)}</td></tr><tr class="s"><th>Penyerapan</th><td>${rp(S.serap)} (${pc}%)</td></tr>`;
 [0,1,2].forEach(i=>$('#p'+i).textContent=N(S.pend[i]));$('#pk').textContent=S.piket;
 $('#litd').innerHTML=lit(S.litd,'#CDCDA0');$('#lita').innerHTML=lit(S.lita,'#E2C25E');$('#pie').innerHTML=pie(S.peg)}
function fit(){$('#poster').style.zoom=Math.min(1,$('#stage').clientWidth/540)}
/* ===== Editor ===== */
const gt=n=>`grid-template-columns:minmax(0,1.7fr) repeat(${n-1},minmax(0,.8fr)) 30px`;
function buildEd(){
 const ip=(p,v,t='text')=>`<input data-p="${p}" type="${t}" value="${E(v)}" ${t==='number'?'min="0" inputmode="numeric"':''}>`;
 let h=`<h2>Data laporan</h2><div class="g2"><label>Tanggal${ip('tgl',S.tgl,'date')}</label><label>Judul${ip('judul',S.judul)}</label><label>Satuan kerja${ip('satker',S.satker)}</label><label>Alokasi anggaran (Rp)${ip('alok',S.alok,'number')}</label><label>Penyerapan (Rp)${ip('serap',S.serap,'number')}</label></div>
 ${pkBlock()}<h3>Pendampingan klien anak</h3><div class="g3"><label>Polri${ip('pend.0',S.pend[0],'number')}</label><label>Kejaksaan${ip('pend.1',S.pend[1],'number')}</label><label>Pengadilan${ip('pend.2',S.pend[2],'number')}</label></div>`;
 SECT.forEach(([k,t,c])=>{h+=`<h3>${t}</h3><div class="rw hd" style="${gt(c.length)}">${c.map(x=>`<span>${x}</span>`).join('')}<span></span></div>`+
  S[k].map((r,i)=>`<div class="rw" style="${gt(c.length)}">${r.map((v,j)=>ip(`${k}.${i}.${j}`,v,j?'number':'text')).join('')}<button class="x" data-del="${k}.${i}" aria-label="Hapus baris">×</button></div>`).join('')+`<button data-add="${k}">+ Tambah baris</button>`});
 $('#ed').innerHTML=h}
$('#ed').addEventListener('input',e=>{if(!ADM)return;const p=e.target.dataset.p;if(!p)return;let v=e.target.type==='number'?N(e.target.value):e.target.value;if(p==='tgl'&&!v)return;
 const a=p.split('.');let o=S;a.slice(0,-1).forEach(x=>o=o[x]);o[a[a.length-1]]=v;draw();save()});
$('#ed').addEventListener('click',e=>{if(!ADM)return;const t=e.target;
 if(t.dataset.del){const[k,i]=t.dataset.del.split('.');S[k].splice(+i,1)}else if(t.dataset.add){S[t.dataset.add].push([...SECT.find(s=>s[0]===t.dataset.add)[3]])}else if(t.dataset.pegadd){const n=$('#pegNew').value.trim();if(!n)return;if(!PEG.some(x=>x.toLowerCase()===n.toLowerCase())){PEG.push(n);pegSave()}setTimeout(()=>$('#pegNew').focus())}else if(t.dataset.pegdel){PEG.splice(+t.dataset.pegdel,1);pegSave()}else return;
 buildEd();draw();save()});
/* ===== Toolbar ===== */
$('#bEd').onclick=()=>{const o=$('#ed').classList.toggle('on');if(o&&innerWidth<1100)$('#ed').scrollIntoView({behavior:'smooth'})};
$('#hist').onchange=async e=>{const v=e.target.value;let ok=API?await pull(v):false;if(!ok)ok=load(v);if(ok){buildEd();draw();try{localStorage.setItem('lh_last',S.tgl)}catch(x){}hist();st('Laporan '+lbl(S.tgl)+' dimuat')}else hist()};
$('#bSync').onclick=async()=>{if(await pull('')){buildEd();draw();hist();st('Data terbaru dimuat '+jam())}};
$('#bDel').onclick=()=>{if(!confirm('Hapus laporan tanggal '+lbl(S.tgl)+' dari riwayat browser?'))return;try{localStorage.removeItem(K+S.tgl)}catch(e){}const k=keys();S=JSON.parse(JSON.stringify(DEF));if(k[0])load(k[0]);buildEd();draw();hist();st('Laporan dihapus')};
$('#bPrint').onclick=()=>print();
$('#bPng').onclick=async()=>{if(!window.html2canvas){st('Fitur gambar butuh koneksi internet');return}const p=$('#poster'),z=p.style.zoom;p.style.zoom=1;
 try{const c=await html2canvas(p,{scale:2,backgroundColor:'#FFC000'}),a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Laporan_Harian_'+S.tgl+'.png';a.click();st('Gambar diunduh')}catch(e){st('Gagal membuat gambar')}p.style.zoom=z};
/* ===== Excel: ekspor & impor (struktur sama dengan file Data_Laporan_Harian_Bapas_Ciangir.xlsx) ===== */
function exp(){if(!window.XLSX){st('Fitur Excel butuh koneksi internet');return}
 const F=(f,v)=>({t:'n',f,v}),wb=XLSX.utils.book_new(),add=(n,rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)};
 const n=S.klien.length,m=S.pidana.length,j=[1,2,3,4].map(i=>sum(S.klien,i)),r=n+2,pc=N(S.alok)?N(S.serap)/N(S.alok):0;
 add('Data Umum',[['Kolom','Isi','Keterangan'],['Tanggal',S.tgl],['Judul',S.judul],['Satuan Kerja',S.satker],['Alokasi Anggaran',N(S.alok)],['Penyerapan Anggaran',N(S.serap)],['Persentase Penyerapan',F('IF(B5=0,0,B6/B5)',pc)],['Petugas Piket',S.piket],['Pendampingan - Polri',N(S.pend[0])],['Pendampingan - Kejaksaan',N(S.pend[1])],['Pendampingan - Pengadilan',N(S.pend[2])]],[30,26,40]);
 add('Data Klien',[['Jenis Bimbingan','Dewasa L','Dewasa P','Anak L','Anak P'],...S.klien,['Jumlah',...'BCDE'.split('').map((c,i)=>F(`SUM(${c}2:${c}${n+1})`,j[i]))],['TOTAL Dewasa / Anak',F(`B${r}+C${r}`,j[0]+j[1]),null,F(`D${r}+E${r}`,j[2]+j[3])],['TOTAL Keseluruhan',F(`B${r+1}+D${r+1}`,j[0]+j[1]+j[2]+j[3])]],[28,14,14,14,14]);
 const lst=(nm,h,a,w)=>add(nm,[h,...a,['Jumlah',...h.slice(1).map((_,i)=>{const c=String.fromCharCode(66+i);return F(`SUM(${c}2:${c}${a.length+1})`,sum(a,i+1))})]],w);
 lst('Litmas Dewasa',['Jenis Litmas','Jumlah'],S.litd,[28,14]);lst('Litmas Anak',['Jenis Litmas','Jumlah'],S.lita,[28,14]);
 lst('Tindak Pidana',['Jenis Perkara','Klien Dewasa','Klien Anak'],S.pidana,[28,16,16]);
 const tp=XLSX.utils.encode_cell({r:m+2,c:0});wb.Sheets['Tindak Pidana'][tp]={t:'s',v:'Selisih dengan Data Klien'};
 wb.Sheets['Tindak Pidana'][XLSX.utils.encode_cell({r:m+2,c:1})]=F(`B${m+2}-'Data Klien'!B${r+1}`,sum(S.pidana,1)-j[0]-j[1]);
 wb.Sheets['Tindak Pidana'][XLSX.utils.encode_cell({r:m+2,c:2})]=F(`C${m+2}-'Data Klien'!D${r+1}`,sum(S.pidana,2)-j[2]-j[3]);
 wb.Sheets['Tindak Pidana']['!ref']='A1:C'+(m+3);
 lst('Pegawai',['Kelompok','Jumlah'],S.peg,[28,14]);
 XLSX.writeFile(wb,'Data_Laporan_Harian_'+S.tgl+'.xlsx');st('File Excel diunduh')}
$('#bExp').onclick=exp;
function imp(f){if(!f||!ADM)return;if(!window.XLSX){st('Fitur Excel butuh koneksi internet');return}const fr=new FileReader();
 fr.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
  const R=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}).slice(1):null;
  const lst=(n,c)=>{const r=R(n);if(!r)return null;const o=[];for(const x of r){if(x[0]==null||/^(jumlah|total|selisih)/i.test(String(x[0]).trim()))break;o.push([String(x[0]),...Array.from({length:c-1},(_,i)=>N(x[i+1]))])}return o};
  const T=JSON.parse(JSON.stringify(S));let ok=0;
  const u=R('Data Umum');if(u){ok++;const m={};u.forEach(x=>{if(x[0])m[String(x[0]).trim().toLowerCase()]=x[1]});
   let d=m['tanggal'];if(d instanceof Date)d=new Date(d.getTime()+12*36e5).toISOString().slice(0,10);else if(d)d=String(d).trim().slice(0,10);
   if(d&&!isNaN(new Date(d)))T.tgl=d;if(m['judul'])T.judul=String(m['judul']);if(m['satuan kerja'])T.satker=String(m['satuan kerja']);
   T.alok=N(m['alokasi anggaran']);T.serap=N(m['penyerapan anggaran']);if(m['petugas piket']!=null)T.piket=String(m['petugas piket']);
   T.pend=[N(m['pendampingan - polri']),N(m['pendampingan - kejaksaan']),N(m['pendampingan - pengadilan'])]}
  [['klien','Data Klien',5],['litd','Litmas Dewasa',2],['lita','Litmas Anak',2],['pidana','Tindak Pidana',3],['peg','Pegawai',2]].forEach(([k,n,c])=>{const l=lst(n,c);if(l){T[k]=l;ok++}});
  if(!ok){st('Format file tidak dikenali - pakai file Data_Laporan_Harian_Bapas_Ciangir.xlsx');return}
  S=T;buildEd();draw();save();st('Data dari Excel berhasil dimuat')}catch(e){st('Gagal membaca file Excel')}};
 fr.readAsArrayBuffer(f)}
$('#file').onchange=e=>{imp(e.target.files[0]);e.target.value=''};
/* ===== Piket pegawai ===== */
function pkNames(){const m=new Map();[...PEG,...pkSplit(S.piket)].forEach(n=>{if(!m.has(n.toLowerCase()))m.set(n.toLowerCase(),n)});return[...m.values()]}
function pkBlock(){const sel=new Set(pkSplit(S.piket).map(x=>x.toLowerCase())),ns=pkNames();
 return `<h3>Petugas piket</h3><div>${ns.map(n=>`<label class="ck"><input type="checkbox" data-pk="${E(n)}" ${sel.has(n.toLowerCase())?'checked':''}>${E(n)}</label>`).join('')||'<small>Belum ada pegawai - tambahkan di bawah.</small>'}</div><div class="rw" style="grid-template-columns:1fr auto;margin-top:6px"><input id="pegNew" placeholder="Nama pegawai baru"><button data-pegadd="1">+ Tambah</button></div>`+
 (PEG.length?`<details><summary style="font-size:12px;cursor:pointer;margin-bottom:6px">Kelola daftar pegawai</summary>${PEG.map((n,i)=>`<div class="rw" style="grid-template-columns:1fr 30px"><span style="font-size:13px">${E(n)}</span><button class="x" data-pegdel="${i}" aria-label="Hapus ${E(n)} dari daftar">×</button></div>`).join('')}</details>`:'')}
$('#ed').addEventListener('change',e=>{const t=e.target;if(!ADM||t.dataset.pk==null)return;const cur=new Set(pkSplit(S.piket).map(x=>x.toLowerCase())),k=t.dataset.pk.toLowerCase();
 S.piket=pkNames().filter(n=>{const l=n.toLowerCase();return l===k?t.checked:cur.has(l)}).join(' & ');draw();save()});
$('#ed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pegNew'){e.preventDefault();$('#ed [data-pegadd]').click()}});
/* ===== Mode admin (viewer = hanya lihat) ===== */
function setAdm(v){ADM=v;document.body.classList.toggle('adm',v);const b=$('#bAdm');b.textContent=v?'Keluar Admin':'Masuk Admin';b.classList.toggle('on',v);
 if(v){seedPeg();buildEd();if(innerWidth>=1100)$('#ed').classList.add('on')}else $('#ed').classList.remove('on')}
function logout(m){pinSet(null);setAdm(false);if(m)st(m)}
async function verify(pin){if(!API)return true;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'login',pin})}),j=await r.json();if(j.ok)return true;st(j.error||'PIN salah');return false}catch(e){st('Tidak bisa terhubung ke server - login admin gagal');return false}}
$('#bAdm').onclick=()=>{if(ADM){logout('Keluar dari mode admin');return}if(!API){setAdm(true);st('Mode admin lokal (belum terhubung ke Google Sheets)');return}$('#pin').value='';$('#dlg').showModal()};
$('#dx').onclick=()=>$('#dlg').close();
$('#fl').onsubmit=async e=>{e.preventDefault();const pin=$('#pin').value;if(!pin)return;$('#dok').disabled=true;st('Memeriksa PIN...');const ok=await verify(pin);$('#dok').disabled=false;if(ok){pinSet(pin);$('#dlg').close();setAdm(true);st('Mode admin aktif')}};
/* ===== Mulai ===== */
try{const l=localStorage.getItem('lh_last');if(l)load(l)}catch(e){}
buildEd();draw();hist();fit();addEventListener('resize',fit);
{const p=pinGet();if(p)verify(p).then(ok=>ok?setAdm(true):pinSet(null))}
if(API){$('#bSync').hidden=false;pull('').then(ok=>{if(ok){buildEd();draw();hist();try{localStorage.setItem(K+S.tgl,JSON.stringify(S));localStorage.setItem('lh_last',S.tgl)}catch(e){}st('Data dimuat dari Google Sheets '+jam())}})}
</script>
